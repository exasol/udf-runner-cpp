name: SLC-CI-Check-For-Build

on:
  workflow_call:
    inputs:
      flavor:
        description: 'A flavor'
        required: true
        type: string
    outputs:
      result:
        description: "Build-Mode: Possible value 'no_build_needed', 'normal', 'rebuild'"
        value: ${{ jobs.check_for_build.outputs.build_mode }}

permissions:
  contents: read

jobs:
  check_for_build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
          submodules: 'recursive'
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0
          submodules: 'recursive'
          persist-credentials: false

      - name: Setup Python & Poetry Environment
        uses: exasol/python-toolbox/.github/actions/python-environment@8b2cd1ebe7e8ad923be55a95ec5da6f4867d1a8e # v11
        with:
          python-version: "3.10"
          poetry-version: "2.3.0"

      - name: Run check
        id: run-check
        run: |
          poetry run -- exaslc-ci check-if-build-needed --flavor "$FLAVOR" --base-ref "$BASE_REF" --github-event "$GITHUB_EVENT" --github-output-var build_mode
        env:
          BASE_REF: ${{ github.base_ref }}
          FLAVOR: ${{ inputs.flavor }}
          GITHUB_EVENT: ${{ github.event_name }}

    outputs:
      build_mode: ${{ steps.run-check.outputs.build_mode }}
