name: OFT Report

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python & Poetry Environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v6
        with:
          python-version: "3.10"
          poetry-version: "2.3.0"
      - name: Run HTML Report
        run: |
          poetry run -- nox -s run-oft-html -- oft_report.html || echo failed
      - name: Run Plaintext Report
        run: |
          poetry run nox -s run-oft
      - name: Run v2 HTML Report
        run: |
          poetry run -- nox -s run-oft-v2-html -- oft_report_v2.html
      - name: Run v2 Plaintext Report
        run: |
          poetry run nox -s run-oft-v2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "oft_reports"
          path: |
            oft_report.html
            oft_report_v2.html
