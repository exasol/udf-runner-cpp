name: SLC-CI

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'rebuild/**'
  pull_request:

permissions:
  contents: read

jobs:
  prepare-test-container:
    uses: $/.github/workflows/slc_ci_prepare_test_container.yml
    secrets:
      CI4_DOCKERHUB_USERNAME: ${{ secrets.CI4_DOCKERHUB_USERNAME }}
      CI4_DOCKERHUB_TOKEN: ${{ secrets.CI4_DOCKERHUB_TOKEN }}

  get-flavors:
    needs: prepare-test-container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Setup Python & Poetry Environment
        uses: exasol/python-toolbox/.github/actions/python-environment@8b2cd1ebe7e8ad923be55a95ec5da6f4867d1a8e # v11
        with:
          python-version: "3.10"
          poetry-version: "2.3.0"

      - id: set-matrix
        run: poetry run -- exaslc-ci get-flavors --github-output-var matrix

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  ci:
    needs: get-flavors
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.flavor }}
      cancel-in-progress: true
    strategy:
      fail-fast: true
      matrix:
        flavor: ${{fromJson(needs.get-flavors.outputs.matrix)}}
    uses: $/.github/workflows/slc_ci_flavor.yml
    secrets:
      CI4_DOCKERHUB_USERNAME: ${{ secrets.CI4_DOCKERHUB_USERNAME }}
      CI4_DOCKERHUB_TOKEN: ${{ secrets.CI4_DOCKERHUB_TOKEN }}
    with:
      flavor: ${{ matrix.flavor }}

  slc-ready:
    needs: ci
    name: SLC Allow Merge
    runs-on: ubuntu-24.04
    steps:
      - name: Print message
        run: echo SLC CI finished
