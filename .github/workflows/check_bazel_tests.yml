name: Check Bazel Tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  USE_BAZEL_VERSION: 8.3.1
  BAZEL_PACKAGE_VERSION: 8.3.1
  PROTOBUF_BIN: protoc
  PROTOBUF_LIBRARY_PREFIX: /usr/lib/x86_64-linux-gnu
  PROTOBUF_INCLUDE_PREFIX: /usr/include
  ZMQ_LIBRARY_PREFIX: /usr/lib/x86_64-linux-gnu
  ZMQ_INCLUDE_PREFIX: /usr/include
jobs:
  v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang curl lcov
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
      - name: Build
        run: bazel build --verbose_failures //...
        working-directory: ./udf-runner-cpp/v2
      - name: Install clang-tidy
        run: |
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" -- 22
          sudo apt-get install -y clang-tidy-22
      - name: Run clang-tidy
        run: bazel build --verbose_failures --config clang-tidy //...
        working-directory: ./udf-runner-cpp/v2
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      - name: Run clang-format
        run: bazel build --verbose_failures --config clang-format //...
        working-directory: ./udf-runner-cpp/v2
      - name: Run v2 fuzz regression tests
        run: |
          bazel test --verbose_failures --test_output=errors --config asan-libfuzzer \
            //:frame_fuzz_test \
            //:call_metadata_fuzz_test \
            //:connection_information_fuzz_test \
            //:export_specification_fuzz_test \
            //:import_specification_fuzz_test \
            //:queue_fuzz_test
        working-directory: ./udf-runner-cpp/v2
      - name: Run tests
        run: >-
          bazel test --verbose_failures --test_output=errors
          --build_tag_filters=-fuzz-test
          --test_tag_filters=-fuzz-test
          //...
        working-directory: ./udf-runner-cpp/v2
      - name: Run coverage tests
        run: >-
          bazel test --verbose_failures --collect_code_coverage
          --combined_report=lcov
          --coverage_report_generator=@bazel_sonarqube//:sonarqube_coverage_generator
          --build_tag_filters=-fuzz-test
          --test_tag_filters=-fuzz-test,-no-coverage
          //...
        working-directory: ./udf-runner-cpp/v2
      - name: SonarCloud Scan
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        with:
          projectBaseDir: ./udf-runner-cpp/v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Search for duplicated error codes
        run: bash find_duplicate_error_codes.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libprotobuf-dev libzmq3-dev protobuf-compiler valgrind
      - name: Install bazel
        run: |
          BAZEL_PACKAGE_FILE="bazel_$BAZEL_PACKAGE_VERSION-linux-x86_64.deb"
          BAZEL_PACKAGE_URL="https://github.com/bazelbuild/bazel/releases/download/$BAZEL_PACKAGE_VERSION/$BAZEL_PACKAGE_FILE"
          curl -L --output /tmp/"$BAZEL_PACKAGE_FILE" "$BAZEL_PACKAGE_URL"
          sudo apt install -y "/tmp/$BAZEL_PACKAGE_FILE"
          rm "/tmp/$BAZEL_PACKAGE_FILE"
      - name: Build
        run: |
          bazel build --lockfile_mode=off --config no-tty -c dbg --config fast-binary --verbose_failures //:udf_runner_cpp_v1_gen //:udf_runner_cpp_v1_static_gen
        working-directory: ./udf-runner-cpp/v1

  tests:
    runs-on: ubuntu-24.04
    strategy:
     fail-fast: false
     matrix:
        include:
          - test: "//exaudflib/test:exaudflib-test"
            name: "exaudflib"
          - test: "//script_options_parser/ctpg/test:script-options-ctpg-parser-test"
            name: "script_options_parser_ctpg"
          - test: "//script_options_parser/legacy/test:script-options-legacy-parser-test"
            name: "script_options_parser_legacy"
          - test: "--run_under='valgrind --leak-check=yes' --config=valgrind //exaudflib/test:exaudflib-test"
            name: "exaudflib_with_valgrind"
          - test: "--run_under='valgrind --leak-check=yes' --config=valgrind //script_options_parser/ctpg/test:script-options-ctpg-parser-test"
            name: "script_options_parser_ctpg_with_valgrind"
          - test: "--run_under='valgrind --leak-check=yes' --config=valgrind //script_options_parser/legacy/test:script-options-legacy-parser-test"
            name: "script_options_parser_legacy_with_valgrind"
          - test: "--config=asan //exaudflib/test:exaudflib-test"
            name: "exaudflib_with_asan"
          - test: "--config=asan //script_options_parser/ctpg/test:script-options-ctpg-parser-test"
            name: "script_options_parser_ctpg_with_asan"
          - test: "--config=asan //script_options_parser/legacy/test:script-options-legacy-parser-test"
            name: "script_options_parser_legacy_with_asan"
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libprotobuf-dev libzmq3-dev protobuf-compiler valgrind
      - name: Install bazel
        run: | 
          BAZEL_PACKAGE_FILE="bazel_$BAZEL_PACKAGE_VERSION-linux-x86_64.deb"
          BAZEL_PACKAGE_URL="https://github.com/bazelbuild/bazel/releases/download/$BAZEL_PACKAGE_VERSION/$BAZEL_PACKAGE_FILE"
          curl -L --output /tmp/"$BAZEL_PACKAGE_FILE" "$BAZEL_PACKAGE_URL"
          sudo apt install -y "/tmp/$BAZEL_PACKAGE_FILE"
          rm "/tmp/$BAZEL_PACKAGE_FILE"
        env:
          BAZEL_PACKAGE_VERSION: "8.3.1"
      - name: Run tests
        run: |
          bazel test ${{ matrix.test }}
        working-directory: ./udf-runner-cpp/v1/base
        env:
          OPENSSL_LIBRARY_PREFIX: "/usr/lib/x86_64-linux-gnu"
          OPENSSL_INCLUDE_PREFIX: "/usr/include/openssl"

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: "${{ matrix.name }}"
          path: /home/runner/.cache/bazel/_bazel_runner/*/execroot/_main/bazel-out/k8-dbg/testlogs/**/test.log
