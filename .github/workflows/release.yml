name: Create GitHub Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python & Poetry Environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v9
        with:
          python-version: "3.10"
          poetry-version: "2.3.0"

      - name: Prepare release changelog
        run: poetry run nox -s prepare-release -- --tag "$GITHUB_REF_NAME"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          changes_file="doc/changes/changes_${TAG}.md"
          test -f "$changes_file"
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file "$changes_file"
