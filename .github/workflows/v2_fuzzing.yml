name: v2 Fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  USE_BAZEL_VERSION: 8.3.1

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang curl
          pipx install poetry
          poetry install --no-interaction --no-ansi --only main
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
      - name: Run bounded fuzzing campaign
        working-directory: .
        run: |
          poetry run nox -s v2-fuzzing -- \
            --timeout-secs 300 --output-root "$RUNNER_TEMP/fuzzing"
      - name: Upload fuzzing artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-fuzzing-artifacts
          path: ${{ runner.temp }}/fuzzing
          if-no-files-found: ignore
