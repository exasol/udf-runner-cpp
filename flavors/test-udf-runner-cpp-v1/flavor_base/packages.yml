build_steps:
- name: build_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: coreutils
        version: 9.4-3ubuntu*
      - name: tar
        version: 1.35+dfsg-3build1
      - name: curl
        version: 8.5.0-2ubuntu*
      - name: build-essential
        version: 12.10ubuntu*
      - name: protobuf-compiler
        version: 3.21.12-8.2ubuntu*
      - name: chrpath
        version: 0.16-2build1
      - name: locales
        version: 2.39-0ubuntu*
    variables:
      PROTOBUF_BIN: /usr/bin/protoc
  - name: install_bazel
    tools:
      bazel:
        version: "8.3.1"
  validation_cfg:
    version_mandatory: true
- name: base_test_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: gdb
        version: 15.0.50.20240403-0ubuntu*
      - name: valgrind
        version: 1:3.22.0-0ubuntu*
      - name: strace
        version: 6.8-0ubuntu*
  validation_cfg:
    version_mandatory: true
- name: security_scan
  phases:
  - name: install_deps
    apt:
      packages:
      - name: gnupg
  - name: install_trivy
    apt:
      repos:
        trivy:
          key_url: https://aquasecurity.github.io/trivy-repo/deb/public.key
          entry: deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main
          out_file: trivy.list
      packages:
      - name: trivy
  validation_cfg:
    version_mandatory: false
version: 1.0.0
