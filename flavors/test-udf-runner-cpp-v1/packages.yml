build_steps:
- name: udfclient_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: coreutils
        version: "*"
      - name: locales
        version: "*"
      - name: libnss-db
        version: "*"
      - name: libzmq3-dev
        version: "*"
      - name: libprotobuf-dev
        version: "*"
      - name: libssl-dev
        version: "*"
    variables:
      PROTOBUF_LIBRARY_PREFIX: /usr/lib/x86_64-linux-gnu
      PROTOBUF_INCLUDE_PREFIX: /usr/include
      ZMQ_LIBRARY_PREFIX: /usr/lib/x86_64-linux-gnu
      ZMQ_INCLUDE_PREFIX: /usr/include
  validation_cfg:
    version_mandatory: true
version: 1.0.0
