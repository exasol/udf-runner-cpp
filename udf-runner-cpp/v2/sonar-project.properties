sonar.organization=exasol
sonar.projectKey=udf-runner-cpp

# The scan base directory is udf-runner-cpp/v2, so inspect all supported files
# in v2 while excluding vendored third-party sources.
sonar.sources=.
sonar.exclusions=third_party/**,bazel-*/**
sonar.coverage.exclusions=**/*_test.cc,**/json_schema_fuzzing.hpp

# Bazel's SonarQube coverage generator writes this generic coverage report.
sonar.coverageReportPaths=bazel-out/_coverage/_coverage_report.dat
