# Mull configuration shared by local runs and CI.
# The Nox session supplies the matching compiler plugin and debug flags.
includePaths:
  - "(^|.*/)udf_protocol\\.cc"
  - "(^|.*/)json_schema\\.hpp"
  - "(^|.*/)mpmc_queue\\.hpp"
  - "(^|.*/)spsc_queue\\.hpp"
  - "(^|.*/)waitable_queue\\.hpp"

excludePaths:
  - "(^|.*/).*_test\\.(cc|cpp)"
  - "(^|.*/).*_benchmark\\.cc"
  - "(^|.*/)third_party/.*"
  - ".*bazel-out/.*"

parallelization:
  workers: 2
  executionWorkers: 2
